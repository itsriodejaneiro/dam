<!doctype html>
<html lang="%lang%" data-theme="%theme%" data-mode="dark">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Fira+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Fira+Mono:wght@400;500;700&display=swap"
			rel="stylesheet"
		/>
		<script>
			// Applies pack + mode before paint to avoid a flash.
			// Precedence: localStorage override > SSR default (already in the attribute).
			(function () {
				try {
					var d = document.documentElement,
						KNOWN = ['legacy', 'green', 'orange'];
					// mode: key 'mode', or the older 'theme' so saved preferences keep working
					var m = localStorage.getItem('mode') || localStorage.getItem('theme');
					if (m === 'light' || m === 'dark') d.dataset.mode = m;
					// pack: replaces the deploy's default only with a valid override
					var p = localStorage.getItem('pack');
					if (p && KNOWN.indexOf(p) !== -1) d.dataset.theme = p;
				} catch (_) {}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
